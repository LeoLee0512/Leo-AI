# Pytest configuration for this repository.
#
# Since 2026-09-14 the installed product (LeoAIStudio/) and the Leo Tree
# project (leotree/) live inside this checkout. A bare `pytest` from the repo
# root would otherwise recurse into LeoAIStudio/upstream/OpenAI4S/tests and
# leotree/ and try to collect their suites with their own dependencies.
# Only this repository's tests/ tree is ours to run.
[pytest]
testpaths = tests
norecursedirs = .* *.egg _darcs build CVS dist node_modules venv {arch} LeoAIStudio* leotree pyi-work wheelhouse
