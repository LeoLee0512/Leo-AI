# Leo AI Studio build dependencies, pinned.
#
# The build used to recover bottle / cffi / clr / proxy_tools / pythonnet /
# clr_loader out of the previous LeoAIStudio.exe's PYZ archive, which meant a
# new build could not be produced without an old one. Every one of those is a
# normal wheel and is pinned here instead.
#
# Regenerate with: .venv/Scripts/python -m pip freeze > requirements.lock
# Install with:    .venv/Scripts/python -m pip install -r requirements.lock
#
# Python: 3.12.9  (base prefix must supply python312.dll)

